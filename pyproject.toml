[project]
name = "jarvis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "starlette>=1.3.1",
    "langchain>=1.3.9",
    "langgraph>=0.2.0",
    "langsmith>=0.8.18",
    "ollama>=0.6.2",
    "msgpack>=1.2.1",
    "pydantic-settings>=2.14.2",
    "uvicorn[standard]>=0.48.0",
    "mcp>=1.28.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.13.0",
    "pip-audit>=2.9.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
# Auto mode so async tests don't silently fail to run if a marker is forgotten.
asyncio_mode = "auto"

[tool.ruff]
# Pin the settings CI already runs with so local and CI lint/format agree.
target-version = "py313"
line-length = 88

[tool.mypy]
python_version = "3.13"
files = ["llm", "api_server", "agent_orchestration", "logging_utils", "main.py"]
# Third-party packages (langgraph, ollama, etc.) ship without type stubs.
ignore_missing_imports = true
